<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Livro do Nosso Amor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
/* Layout: livro de couro escuro com rosas douradas em relevo, em pé no centro; páginas de papel marfim em estilo editorial (foto grande, legenda embaixo). Visual escuro e único (de propósito). */
:root {
  --bg: #0d0709;
  --bg-glow: #2c0f19;
  --leather: #3a0f1b;
  --leather-hi: #5e1a2e;
  --leather-deep: #230810;
  --gold: #d3ad63;
  --gold-light: #f6e2aa;
  --gold-deep: #a98443;
  --paper: #f7f1e6;
  --paper-edge: #e6dac3;
  --ink: #33201f;
  --ink-soft: #85696b;
  --rose: #9c3b50;
  --sheet: #170a0f;
  --font-script: "Pinyon Script", "Snell Roundhand", cursive;
  --font-text: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-ui: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  --chain: none;
  --noise: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }
body {
  background: var(--bg);
  color: var(--paper);
  font-family: var(--font-text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  background-image:
    radial-gradient(ellipse at 50% 30%, var(--bg-glow) 0%, transparent 65%),
    radial-gradient(ellipse at 50% 120%, rgba(211, 173, 99, .08) 0%, transparent 55%);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

.app {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
}

/* ---------- pétalas ---------- */
.petal {
  position: fixed; top: 0;
  width: var(--s, 14px); height: var(--s, 14px);
  pointer-events: none; z-index: 20; opacity: .55;
  animation: fall var(--d, 14s) linear infinite;
  animation-delay: var(--w, 0s);
  will-change: transform;
}
.petal svg { width: 100%; height: 100%; display: block; }
@keyframes fall {
  0% { transform: translate3d(0, -6vh, 0) rotate(0deg); }
  25% { transform: translate3d(var(--sw, 30px), 26vh, 0) rotate(120deg); }
  50% { transform: translate3d(calc(var(--sw, 30px) * -.6), 52vh, 0) rotate(220deg); }
  75% { transform: translate3d(var(--sw, 30px), 80vh, 0) rotate(300deg); }
  100% { transform: translate3d(0, 108vh, 0) rotate(380deg); }
}

/* ---------- livro ---------- */
.book {
  position: relative;
  width: min(100%, 460px, calc((100dvh - 120px) / 1.6));
  aspect-ratio: 10 / 16;
  perspective: 1800px;
  flex: none;
  border-radius: 3px 8px 8px 3px;
  box-shadow:
    1px 1px 0 #efe5d0, 2px 2px 0 #cdbfa3, 3px 3px 0 #efe5d0, 4px 4px 0 #cdbfa3, 5px 5px 0 #efe5d0, 6px 6px 0 #bfb092,
    0 34px 70px rgba(0, 0, 0, .7), 0 0 100px rgba(160, 50, 70, .14);
}
.leaf {
  position: absolute; inset: 0;
  transform-origin: left center;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: transform 1.1s cubic-bezier(.55, .05, .25, 1), visibility 0s linear 0s;
  border-radius: 3px 8px 8px 3px;
  overflow: hidden;
}
.leaf.turned {
  transform: rotateY(-180deg);
  visibility: hidden; pointer-events: none;
  transition: transform 1.1s cubic-bezier(.55, .05, .25, 1), visibility 0s linear 1.1s;
}

/* rosas e ornamentos em linha dourada */
.bq { position: absolute; width: 29%; aspect-ratio: 1; pointer-events: none; z-index: 4; }
.bq svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.bq.tl { left: -4%; top: -3%; }
.bq.tr { right: -4%; top: -3%; transform: scaleX(-1); }
.bq.bl { left: -4%; bottom: -3%; transform: scaleY(-1); }
.bq.br { right: -4%; bottom: -3%; transform: scale(-1, -1); }
.rs { display: block; overflow: visible; }

/* ---------- capa ---------- */
.cover {
  --rf: #3a0e1a; --rs: #d3ad63;
  background:
    var(--noise),
    linear-gradient(90deg, rgba(0,0,0,.6) 0, rgba(0,0,0,0) 8%),
    linear-gradient(180deg, rgba(255,255,255,.05) 0, transparent 30%),
    radial-gradient(ellipse at 45% 35%, var(--leather-hi) 0%, var(--leather) 50%, var(--leather-deep) 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 220, 160, .12), inset 0 0 40px rgba(0,0,0,.45);
  z-index: 30;
}
.cover::before {
  content: ""; position: absolute;
  inset: 4.5% 6% 4.5% 11%;
  border: 1.5px solid rgba(211, 173, 99, .7);
  pointer-events: none;
}
.cover::after {
  content: ""; position: absolute;
  inset: calc(4.5% + 7px) calc(6% + 7px) calc(4.5% + 7px) calc(11% + 7px);
  border: 1px solid rgba(211, 173, 99, .3);
  pointer-events: none;
}
.spine {
  position: absolute; top: 0; bottom: 0; left: 6.5%; width: 3%;
  border-left: 1px solid rgba(0,0,0,.6);
  border-right: 1px solid rgba(255, 220, 160, .2);
  background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.04));
  pointer-events: none;
}
.cover-title { position: absolute; left: 0; right: 0; top: 10%; text-align: center; z-index: 5; padding-left: 8%; }
.foil {
  background: linear-gradient(180deg, var(--gold-light), var(--gold) 55%, #9a7634);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.cover-title h1 {
  margin: 0;
  font-family: var(--font-script); font-weight: 400;
  font-size: clamp(1.7rem, 8.4vw, 2.45rem);
  line-height: 1.05; text-wrap: balance;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.85));
}
.cover-title small {
  display: block; margin-top: 8px;
  font-family: var(--font-ui); font-size: .58rem; letter-spacing: .34em; text-transform: uppercase;
  color: var(--gold); opacity: .9;
}
.plate {
  position: absolute; left: 50%; bottom: 9.5%;
  transform: translateX(-45%);
  z-index: 6; width: 50%; text-align: center;
  padding: 8px 6px 9px;
  border-radius: 4px;
  background: linear-gradient(180deg, #f3dfa6, #c9a45a 55%, #a8833f);
  color: #35180f;
  box-shadow: 0 3px 8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.65), inset 0 0 0 1px rgba(90,60,20,.35);
  transition: opacity .5s, transform .8s;
}
.plate span { display: block; font-family: var(--font-ui); font-size: .52rem; letter-spacing: .24em; text-transform: uppercase; }
.plate b { display: block; font-family: var(--font-text); font-size: clamp(1.1rem, 5.4vw, 1.45rem); font-weight: 600; line-height: 1.15; white-space: nowrap; }

/* correntes */
.chain {
  position: absolute; left: 50%; top: 50%;
  width: 190%; height: 26px;
  background: var(--chain) repeat-x center / auto 26px;
  filter: drop-shadow(0 4px 3px rgba(0,0,0,.7));
  transition: transform 1.2s cubic-bezier(.5, 0, .9, .5), opacity 1.2s;
  z-index: 3;
}
.chain.a { transform: translate(-50%, -50%) rotate(58deg); }
.chain.b { transform: translate(-50%, -50%) rotate(-58deg); }
.book.unchained .chain.a { transform: translate(-50%, 160%) rotate(75deg); opacity: 0; }
.book.unchained .chain.b { transform: translate(-50%, 160%) rotate(-75deg); opacity: 0; }
.book.unchained .plate { opacity: 0; transform: translate(-45%, 14px); }

/* cadeado */
.lock {
  position: absolute; left: 50%; top: 50%;
  width: 23%; aspect-ratio: 84 / 104; min-width: 72px;
  transform: translate(-50%, -50%);
  z-index: 8; background: none; border: 0; padding: 0;
  transition: transform 1s cubic-bezier(.5, 0, .9, .5), opacity .9s;
  -webkit-tap-highlight-color: transparent;
}
.lock svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 7px 8px rgba(0,0,0,.65)); }
.lock .sh { transform-box: fill-box; transform-origin: 100% 100%; transition: transform .6s cubic-bezier(.3, 1.4, .5, 1); }
.lock.open .sh { transform: translateY(-7px) rotate(-32deg); }
.lock:not(.open) { animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { filter: drop-shadow(0 0 0 rgba(246, 226, 170, 0)); }
  50% { filter: drop-shadow(0 0 14px rgba(246, 226, 170, .8)); }
}
.lock.shake { animation: shake .5s; }
@keyframes shake {
  0%, 100% { transform: translate(-50%, -50%) rotate(0); }
  20% { transform: translate(-50%, -50%) rotate(-9deg); }
  40% { transform: translate(-50%, -50%) rotate(8deg); }
  60% { transform: translate(-50%, -50%) rotate(-5deg); }
  80% { transform: translate(-50%, -50%) rotate(3deg); }
}
.book.unchained .lock { transform: translate(-50%, 520%) rotate(25deg); opacity: 0; }
.tap-hint {
  position: absolute; left: 50%; top: calc(50% + 15.5%);
  transform: translateX(-50%); white-space: nowrap;
  padding: 5px 13px; border-radius: 999px;
  background: rgba(16, 4, 8, .8); border: 1px solid rgba(211, 173, 99, .5);
  z-index: 7;
  font-family: var(--font-ui); font-size: .58rem; letter-spacing: .24em; text-transform: uppercase;
  color: var(--gold-light); pointer-events: none; transition: opacity .4s;
}
.book.unchained .tap-hint, .lock.open ~ .tap-hint { opacity: 0; }

/* ---------- páginas ---------- */
.page {
  --rf: #f7f1e6; --rs: #b48f4a;
  background:
    var(--noise),
    linear-gradient(90deg, rgba(60, 30, 20, .22) 0, rgba(60, 30, 20, 0) 9%),
    radial-gradient(ellipse at 50% 45%, #fcf7ec 0%, var(--paper) 65%, #eee2c9 100%);
  color: var(--ink);
  padding: 8% 8% 6% 12.5%;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: inset -1px 0 0 var(--paper-edge);
}
.page::before {
  content: ""; position: absolute;
  inset: 12px 12px 12px 19px;
  border: 1px solid rgba(180, 143, 74, .5);
  pointer-events: none;
}
.page > * { position: relative; z-index: 1; }
.page > .bq { position: absolute; z-index: 1; }
.nav button[hidden] { display: none; }
.frame {
  flex: 1 1 0; min-height: 0;
  padding: 5px;
  background: #fffdf8;
  border: 1px solid rgba(180, 143, 74, .75);
  box-shadow: 0 10px 22px rgba(51, 32, 31, .22);
  position: relative;
}
.frame .media {
  position: absolute; inset: 5px;
  width: calc(100% - 10px); height: calc(100% - 10px);
  object-fit: cover; background: #d9c8b0;
}
.frame::after {
  content: ""; position: absolute; inset: 5px; pointer-events: none;
  box-shadow: inset 0 0 20px rgba(51, 10, 20, .22);
}
.cap { flex: none; display: flex; flex-direction: column; gap: 7px; align-items: center; }
.cap h2, .tl-label {
  margin: 0;
  font-family: var(--font-ui); font-weight: 500;
  font-size: .68rem; letter-spacing: .3em; text-transform: uppercase;
  color: var(--rose); text-align: center;
}
.page p {
  margin: 0;
  font-family: var(--font-text); font-style: italic; font-weight: 500;
  font-size: clamp(1.08rem, 4.6vw, 1.28rem);
  line-height: 1.3; text-align: center; text-wrap: pretty;
  max-height: 100%; overflow-y: auto;
}
.pn {
  flex: none; text-align: right;
  font-family: var(--font-ui); font-size: .58rem; letter-spacing: .22em;
  color: var(--ink-soft); padding-right: 6%;
}
.script {
  margin: 0;
  font-family: var(--font-script); font-weight: 400;
  font-size: clamp(2rem, 9.5vw, 2.7rem);
  line-height: 1.1; color: var(--rose); text-align: center; text-wrap: balance;
}

/* divisor com rosa */
.orn { display: flex; align-items: center; gap: 10px; width: 66%; align-self: center; flex: none; }
.orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--rs)); }
.orn::after { background: linear-gradient(270deg, transparent, var(--rs)); }
.orn svg { width: 26px; height: 26px; flex: none; }

/* dedicatória */
.dedic { justify-content: center; align-items: center; text-align: center; gap: 16px; }
.dedic .big-rose { width: 34%; filter: drop-shadow(0 4px 5px rgba(60, 30, 10, .25)); }
.dedic p { font-size: clamp(1.15rem, 5vw, 1.38rem); }
.sign { font-family: var(--font-script); font-size: 1.75rem; color: var(--rose); text-align: center; }

/* carta */
.letter, .list { justify-content: flex-start; padding-top: 12%; gap: 12px; }
.letter .body { display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: center; }
.letter p { text-align: left; font-size: clamp(1.05rem, 4.4vw, 1.24rem); line-height: 1.34; }
.letter p.first::first-letter {
  font-family: var(--font-script); font-style: normal;
  font-size: 3.2em; line-height: .8; float: left; padding: 4px 8px 0 0; color: var(--rose);
}
.letter .sign { text-align: right; }

/* listas */
.list ul { list-style: none; margin: 0; padding: 0 2%; display: flex; flex-direction: column; gap: 11px; flex: 1; justify-content: center; }
.list li { display: flex; gap: 11px; align-items: flex-start; font-style: italic; font-weight: 500; font-size: clamp(1.05rem, 4.4vw, 1.22rem); line-height: 1.25; }
.list li svg { flex: none; width: 24px; height: 24px; margin-top: -2px; }

/* final */
.final {
  --rf: #3d0f1c; --rs: #d3ad63;
  justify-content: center; align-items: center; text-align: center; gap: 8px;
  background:
    var(--noise),
    linear-gradient(90deg, rgba(0,0,0,.4) 0, rgba(0,0,0,0) 9%),
    radial-gradient(ellipse at 50% 42%, var(--leather-hi) 0%, var(--leather) 52%, var(--leather-deep) 100%);
  color: var(--paper);
}
.final::before { border-color: rgba(211, 173, 99, .55); }
.final .bq { width: 31%; z-index: 1; }
.final .big-rose { width: 38%; filter: drop-shadow(0 0 22px rgba(246, 226, 170, .35)); animation: beat 2.4s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 20% { transform: scale(1.06); } 40% { transform: scale(1); } }
.final .big {
  font-family: var(--font-script);
  font-size: clamp(3.8rem, 20vw, 5.8rem);
  line-height: 1.1; white-space: nowrap;
  filter: drop-shadow(0 0 18px rgba(246, 226, 170, .45));
}
.final p { color: var(--gold-light); max-width: 76%; font-size: clamp(1.1rem, 4.8vw, 1.32rem); }
.final .forever { font-family: var(--font-ui); font-size: .6rem; letter-spacing: .36em; text-transform: uppercase; color: var(--gold); margin-top: 6px; }
.final .pn { color: rgba(246, 226, 170, .55); position: absolute; right: 8%; bottom: 3.5%; padding: 0; }
.rose-btn { background: none; border: 0; padding: 0; width: 38%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.rose-btn .big-rose { width: 100%; height: auto; transition: transform .2s; }
.rose-btn:active .big-rose { transform: scale(.93); }
.touch {
  margin-top: 8px; padding: 9px 20px; border-radius: 999px;
  border: 1px solid rgba(211, 173, 99, .7);
  background: rgba(16, 4, 8, .55);
  color: var(--gold-light);
  font-family: var(--font-ui); font-size: .66rem; letter-spacing: .26em; text-transform: uppercase;
  animation: hintpulse 2.4s ease-in-out infinite;
}
@keyframes hintpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(246, 226, 170, 0); } 50% { box-shadow: 0 0 16px 2px rgba(246, 226, 170, .45); } }
.floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0 !important; }
.floaters svg { position: absolute; bottom: -30px; width: var(--s, 18px); height: var(--s, 18px); opacity: 0; fill: #d98a9a; }
.leaf.current .floaters svg { animation: rise var(--d, 7s) linear infinite; animation-delay: var(--w, 0s); }
@keyframes rise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: .65; }
  100% { transform: translateY(-640px) translateX(var(--x, 20px)); opacity: 0; }
}

/* ---------- navegação ---------- */
.nav {
  flex: none; height: 52px;
  display: flex; align-items: center; justify-content: center; gap: 18px;
  opacity: 0; pointer-events: none; transition: opacity .8s;
  position: relative; z-index: 25;
}
.nav.on { opacity: 1; pointer-events: auto; }
.nav button {
  width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid rgba(211, 173, 99, .55);
  background: rgba(58, 15, 27, .7);
  color: var(--gold-light);
  display: grid; place-items: center;
}
.nav button:disabled { opacity: .3; cursor: default; }
.nav svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.count { min-width: 70px; text-align: center; font-family: var(--font-ui); font-size: .7rem; letter-spacing: .25em; color: var(--gold); }

/* ---------- teclado da senha ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(6, 2, 4, .7); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 50; }
.sheet {
  position: fixed; left: 50%; bottom: 0;
  width: min(100%, 380px);
  transform: translate(-50%, 105%);
  transition: transform .35s cubic-bezier(.2, .8, .2, 1);
  z-index: 60;
  background: var(--sheet);
  border: 1px solid rgba(211, 173, 99, .4); border-bottom: 0;
  border-radius: 20px 20px 0 0;
  padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  text-align: center; visibility: hidden;
}
body.asking .backdrop { opacity: 1; pointer-events: auto; }
body.asking .sheet { transform: translate(-50%, 0); visibility: visible; }
.sheet .close { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; background: none; border: 0; color: var(--gold); font-size: 1.5rem; line-height: 1; }
.sheet .eyebrow { font-family: var(--font-ui); font-size: .6rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }
.sheet .eq { margin: 4px 0 12px; font-size: 2rem; font-weight: 600; color: var(--gold-light); white-space: nowrap; }
.display {
  height: 58px; border-radius: 10px;
  border: 1px solid rgba(211, 173, 99, .5); background: rgba(0, 0, 0, .35);
  display: grid; place-items: center;
  font-family: var(--font-ui); font-size: 1.9rem; letter-spacing: .4em; padding-left: .4em;
  color: var(--paper); font-variant-numeric: tabular-nums;
}
.display.err { animation: shakeX .45s; border-color: #e0687f; }
@keyframes shakeX { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
.msg { min-height: 1.6em; margin: 8px 0 6px; font-size: 1.05rem; font-style: italic; color: #f0a3b1; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keys button { height: 54px; border-radius: 12px; border: 1px solid rgba(211, 173, 99, .35); background: rgba(58, 15, 27, .6); color: var(--paper); font-family: var(--font-ui); font-size: 1.35rem; }
.keys button:active { background: rgba(156, 59, 80, .7); }
.keys .go { background: linear-gradient(180deg, #f3dfa6, #c9a45a); color: #35180f; font-size: .8rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }

@media (prefers-reduced-motion: reduce) {
  .leaf, .leaf.turned, .chain, .lock, .lock .sh { transition-duration: .01s !important; transition-delay: 0s !important; }
  .lock:not(.open), .final .big-rose, .leaf.current .floaters svg { animation: none; }
  .petal { display: none; }
}
</style>

<svg class="defs" id="defs" aria-hidden="true" focusable="false"></svg>

<main class="app">
  <div class="book" id="book" aria-live="polite"></div>
  <nav class="nav" id="nav" aria-label="Páginas">
    <button id="prev" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="count" id="count">1 / 12</div>
    <button id="next" aria-label="Próxima página"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button id="music" aria-label="Pausar música" hidden></button>
  </nav>
</main>
<div id="petals"></div>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-label="Senha do cadeado">
  <button class="close" id="close" aria-label="Fechar">&times;</button>
  <div class="eyebrow">Para abrir, resolva</div>
  <div class="eq">40 + 150 ÷ 50</div>
  <div class="display" id="display" aria-live="polite"></div>

  var playing = false;
  function setIcon() {
    musicBtn.setAttribute("aria-label", playing ? "Pausar música" : "Tocar música");
    musicBtn.innerHTML = playing
      ? '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  }
  function startMusic() {
    var p = song.play();
    if (p && p.then) p.then(function () { playing = true; musicBtn.hidden = false; setIcon(); }).catch(function () {});
  }
  musicBtn.addEventListener("click", function () {
    if (playing) { song.pause(); playing = false; } else { var p = song.play(); if (p && p.catch) p.catch(function () {}); playing = true; }
    setIcon();
  });

  lock.addEventListener("click", function () { ask(true); });
  document.getElementById("close").addEventListener("click", function () { ask(false); });
  document.getElementById("backdrop").addEventListener("click", function () { ask(false); });
  document.getElementById("keys").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) press(b.getAttribute("data-k"));
  });
  document.addEventListener("keydown", function (e) {
    if (!document.body.classList.contains("asking")) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("del");
    else if (e.key === "Enter") press("go");
    else if (e.key === "Escape") ask(false);
  });

  update();
})();
</script>

</body></html>
